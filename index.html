<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<script>
/* LINE WebView 自動跳外部瀏覽器（沿用窩的家共用 snippet，避免 LINE 內建瀏覽器快取/cookie 限制）*/
(function () {
  var ua = navigator.userAgent || '';
  var isLine = /Line\//.test(ua);
  var url = new URL(location.href);
  var alreadyRedirected = url.searchParams.has('openExternalBrowser');
  if (isLine && !alreadyRedirected) {
    if (!url.searchParams.has('v')) {
      url.searchParams.set('v', new Date().toISOString().slice(0, 10).replace(/-/g, ''));
    }
    url.searchParams.set('openExternalBrowser', '1');
    window.location.href = url.toString();
  }
})();
</script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">

<title>BNI 華都更分會｜PowerTeam 產業鏈分組看板</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@500;700;900&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --red: #C8102E;
    --gold: #C8A04F;
    --white: #FFFFFF;
    --gray: #F5F5F5;
    --ink: #1A1A1A;
    --ink-dim: #6b6b6b;
    --border: #e2ddd2;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    background: var(--gray);
    color: var(--ink);
    font-family: 'Noto Sans TC', sans-serif;
    line-height: 1.6;
    min-height: 100vh;
    -webkit-font-smoothing: antialiased;
  }

  header {
    background: var(--red);
    color: var(--white);
    padding: 20px 16px 24px;
    text-align: center;
  }

  header .eyebrow {
    font-size: 12.5px;
    letter-spacing: 0.12em;
    opacity: 0.85;
    margin-bottom: 6px;
  }

  header h1 {
    font-family: 'Noto Serif TC', serif;
    font-weight: 900;
    font-size: clamp(20px, 5vw, 28px);
    line-height: 1.4;
  }

  .search-wrap {
    max-width: 480px;
    margin: 16px auto 0;
    padding: 0 8px;
  }

  #searchInput {
    width: 100%;
    padding: 12px 16px;
    border-radius: 999px;
    border: none;
    font-size: 15px;
    font-family: 'Noto Sans TC', sans-serif;
    outline: none;
    box-shadow: 0 2px 8px rgba(0,0,0,0.15);
  }

  #searchInput:focus { box-shadow: 0 0 0 3px var(--gold); }

  #searchHint {
    color: var(--white);
    font-size: 12.5px;
    margin-top: 8px;
    min-height: 16px;
    opacity: 0.9;
  }

  main {
    max-width: 1400px;
    margin: 0 auto;
    padding: 20px 12px 60px;
  }

  .board {
    display: grid;
    grid-template-columns: repeat(5, minmax(230px, 1fr));
    gap: 14px;
  }

  .column {
    background: var(--white);
    border-radius: 10px;
    border: 1px solid var(--border);
    overflow: hidden;
    display: flex;
    flex-direction: column;
  }

  .column-head {
    background: linear-gradient(135deg, var(--red), #a30d24);
    color: var(--white);
    padding: 14px 14px 12px;
  }

  .column-head .chain-code {
    display: inline-block;
    background: var(--gold);
    color: var(--ink);
    font-weight: 700;
    font-size: 13px;
    padding: 2px 9px;
    border-radius: 999px;
    margin-bottom: 6px;
  }

  .column-head .chain-name {
    font-family: 'Noto Serif TC', serif;
    font-weight: 700;
    font-size: 16px;
    line-height: 1.4;
    margin-bottom: 6px;
  }

  .column-head .chain-meta {
    font-size: 12.5px;
    opacity: 0.92;
    line-height: 1.6;
  }

  .column-head .chain-count {
    font-weight: 700;
  }

  .member-list {
    padding: 10px;
    display: flex;
    flex-direction: column;
    gap: 8px;
    flex: 1;
  }

  .member-card {
    background: var(--gray);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 9px 11px;
    font-size: 13px;
    line-height: 1.5;
    position: relative;
    transition: box-shadow 0.2s, border-color 0.2s;
  }

  .member-card .m-name {
    font-weight: 700;
    font-size: 14px;
  }

  .member-card .m-id {
    color: var(--ink-dim);
    font-size: 12px;
    margin-left: 4px;
  }

  .member-card .m-profession {
    color: var(--ink-dim);
    font-size: 12.5px;
    margin-top: 2px;
  }

  .badge-joint {
    display: inline-block;
    background: var(--gold);
    color: var(--ink);
    font-weight: 700;
    font-size: 11px;
    padding: 1px 7px;
    border-radius: 999px;
    margin-left: 6px;
    vertical-align: middle;
  }

  .member-card.highlight {
    border-color: var(--red);
    box-shadow: 0 0 0 2px var(--red);
    background: #fff4f5;
  }

  .empty-hint {
    color: var(--ink-dim);
    font-size: 12.5px;
    padding: 6px 2px;
  }

  .unassigned-section {
    margin-top: 26px;
    background: var(--white);
    border: 1px dashed var(--border);
    border-radius: 10px;
    padding: 16px;
  }

  .unassigned-section h2 {
    font-family: 'Noto Serif TC', serif;
    font-size: 16px;
    color: var(--red);
    margin-bottom: 10px;
  }

  .unassigned-list {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
  }

  .unassigned-list .member-card { width: 200px; }

  footer {
    text-align: center;
    color: var(--ink-dim);
    font-size: 11.5px;
    padding: 10px 12px 30px;
  }

  #loadStatus {
    text-align: center;
    font-size: 12px;
    color: var(--ink-dim);
    padding: 6px 0 2px;
  }

  /* RWD：手機改橫向捲動每欄，字級不低於 13px，不橫向溢出頁面本體 */
  @media (max-width: 860px) {
    .board {
      display: flex;
      overflow-x: auto;
      scroll-snap-type: x mandatory;
      gap: 10px;
      padding-bottom: 6px;
      -webkit-overflow-scrolling: touch;
    }
    .column {
      min-width: 82vw;
      max-width: 82vw;
      scroll-snap-align: start;
      flex-shrink: 0;
    }
    .unassigned-list .member-card { width: 100%; }
  }
</style>
</head>
<body>

<header>
  <div class="eyebrow">BNI Hua Urban+ Renewal Chapter</div>
  <h1>PowerTeam 產業鏈分組看板</h1>
  <div class="search-wrap">
    <input type="text" id="searchInput" placeholder="🔍 找我在哪組（輸入姓名或編號）">
    <div id="searchHint"></div>
  </div>
</header>

<main>
  <div id="loadStatus"></div>
  <div class="board" id="board"></div>

  <div class="unassigned-section">
    <h2>尚未分組</h2>
    <div class="unassigned-list" id="unassignedList"></div>
  </div>
</main>

<footer>
  BNI 華都更分會 PowerTeam 組別管理系統 · 唯讀看板（里程碑 1）
</footer>

<script src="data.js?v=20260710"></script>
<script>
/* ============================================================
   GAS 後端網址（唯讀 doGet，正式部署已上線）
   ============================================================ */
const GAS_URL = "https://script.google.com/macros/s/AKfycbxDLC_mhRaLhlycnLWhRmdTdI9HU6BHQEXhdANMZL0aF0yTTrMzvxHi0u-YyHMJCP9Jzg/exec";

const CHAIN_ORDER = ['A', 'B', 'C', 'D', 'E'];

const boardEl = document.getElementById('board');
const unassignedEl = document.getElementById('unassignedList');
const loadStatusEl = document.getElementById('loadStatus');
const searchInput = document.getElementById('searchInput');
const searchHint = document.getElementById('searchHint');

function escapeHtml(s) {
  return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
    return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
  });
}

function memberCardHtml(m) {
  const joint = m.chains && m.chains.length > 1;
  return (
    '<div class="member-card" data-id="' + m.id + '" data-name="' + escapeHtml(m.name) + '">' +
      '<div class="m-name">' + escapeHtml(m.name) +
        '<span class="m-id">#' + m.id + '</span>' +
        (joint ? '<span class="badge-joint">兼</span>' : '') +
      '</div>' +
      '<div class="m-profession">' + escapeHtml(m.profession || '') + '</div>' +
    '</div>'
  );
}

function render(data) {
  const groups = data.groups || [];
  const members = data.members || [];

  const byCode = {};
  CHAIN_ORDER.forEach(function (c) { byCode[c] = []; });
  members.forEach(function (m) {
    (m.chains || []).forEach(function (c) {
      if (byCode[c]) byCode[c].push(m);
    });
  });

  const groupMeta = {};
  groups.forEach(function (g) { groupMeta[g.code] = g; });

  boardEl.innerHTML = CHAIN_ORDER.map(function (code) {
    const g = groupMeta[code] || { name: code, leader: '', schedule: '' };
    const list = byCode[code] || [];
    const cardsHtml = list.length
      ? list.map(memberCardHtml).join('')
      : '<div class="empty-hint">目前無組員</div>';
    return (
      '<div class="column" data-chain="' + code + '">' +
        '<div class="column-head">' +
          '<span class="chain-code">' + code + '</span>' +
          '<div class="chain-name">' + escapeHtml(g.name) + '</div>' +
          '<div class="chain-meta">組長：' + escapeHtml(g.leader) + ' ・ <span class="chain-count">' + list.length + ' 人</span></div>' +
          '<div class="chain-meta">' + escapeHtml(g.schedule || '待補') + '</div>' +
        '</div>' +
        '<div class="member-list">' + cardsHtml + '</div>' +
      '</div>'
    );
  }).join('');

  const unassigned = members.filter(function (m) { return !m.chains || m.chains.length === 0; });
  unassignedEl.innerHTML = unassigned.length
    ? unassigned.map(memberCardHtml).join('')
    : '<div class="empty-hint">目前所有夥伴皆已分組</div>';

  applySearch();
}

function applySearch() {
  const q = searchInput.value.trim();
  const cards = document.querySelectorAll('.member-card');
  if (!q) {
    cards.forEach(function (c) { c.classList.remove('highlight'); });
    searchHint.textContent = '';
    return;
  }
  let hitCount = 0;
  let firstHit = null;
  cards.forEach(function (c) {
    const name = c.getAttribute('data-name') || '';
    const id = c.getAttribute('data-id') || '';
    const hit = name.indexOf(q) !== -1 || id === q;
    c.classList.toggle('highlight', hit);
    if (hit) {
      hitCount++;
      if (!firstHit) firstHit = c;
    }
  });
  if (hitCount > 0) {
    searchHint.textContent = '找到 ' + hitCount + ' 筆結果（已高亮所在欄位）';
    if (firstHit) firstHit.scrollIntoView({ behavior: 'smooth', block: 'nearest', inline: 'center' });
  } else {
    searchHint.textContent = '沒有找到符合的夥伴';
  }
}

searchInput.addEventListener('input', applySearch);

// 冷啟先渲染內嵌 seed，避免 GAS 冷啟 2~4 秒白屏
render(window.PT_SEED || { groups: [], members: [] });

// GAS 資料到手後靜默覆蓋；失敗則保留 seed 畫面（降級不假裝成功）
fetch(GAS_URL + '?t=' + Date.now(), { method: 'GET', cache: 'no-store' })
  .then(function (res) { return res.json(); })
  .then(function (data) {
    if (!data || !data.ok) throw new Error('bad response');
    render(data);
    loadStatusEl.textContent = '';
  })
  .catch(function (err) {
    console.error(err);
    loadStatusEl.textContent = '⚠️ 連不到後端，目前顯示的是內建初始分組（可能非最新）';
  });
</script>

</body>
</html>
