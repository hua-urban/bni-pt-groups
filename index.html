<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<script>
/* LINE WebView 自動跳外部瀏覽器（沿用窩的家共用 snippet，避免 LINE 內建瀏覽器快取/cookie 限制）*/
(function () {
  var ua = navigator.userAgent || '';
  var isLine = /Line\//.test(ua);
  var url = new URL(location.href);
  var alreadyRedirected = url.searchParams.has('openExternalBrowser');
  if (isLine && !alreadyRedirected) {
    if (!url.searchParams.has('v')) {
      url.searchParams.set('v', new Date().toISOString().slice(0, 10).replace(/-/g, ''));
    }
    url.searchParams.set('openExternalBrowser', '1');
    window.location.href = url.toString();
  }
})();
</script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>BNI 華都更分會｜PowerTeam 產業鏈分組看板</title>

<style>
  :root {
    --red: #C8102E;
    --gold: #C8A04F;
    --white: #FFFFFF;
    --gray: #F5F5F5;
    --ink: #1A1A1A;
    --ink-dim: #6b6b6b;
    --border: #e2ddd2;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    background: var(--gray);
    color: var(--ink);
    font-family: 'Noto Sans TC', sans-serif;
    line-height: 1.6;
    min-height: 100vh;
    -webkit-font-smoothing: antialiased;
  }

  header {
    background: var(--red);
    color: var(--white);
    padding: 20px 16px 24px;
    text-align: center;
  }

  header .eyebrow {
    font-size: 12.5px;
    letter-spacing: 0.12em;
    opacity: 0.85;
    margin-bottom: 6px;
  }

  header h1 {
    font-family: 'Noto Serif TC', serif;
    font-weight: 900;
    font-size: clamp(20px, 5vw, 28px);
    line-height: 1.4;
  }

  .search-wrap {
    max-width: 480px;
    margin: 16px auto 0;
    padding: 0 8px;
  }

  #searchInput {
    width: 100%;
    padding: 12px 16px;
    border-radius: 999px;
    border: none;
    font-size: 15px;
    font-family: 'Noto Sans TC', sans-serif;
    outline: none;
    box-shadow: 0 2px 8px rgba(0,0,0,0.15);
  }

  #searchInput:focus { box-shadow: 0 0 0 3px var(--gold); }

  #searchHint {
    color: var(--white);
    font-size: 12.5px;
    margin-top: 8px;
    min-height: 16px;
    opacity: 0.9;
  }

  main {
    max-width: 1400px;
    margin: 0 auto;
    padding: 20px 12px 60px;
  }

  .board {
    display: grid;
    grid-template-columns: repeat(5, minmax(230px, 1fr));
    gap: 14px;
  }

  .column {
    background: var(--white);
    border-radius: 10px;
    border: 1px solid var(--border);
    overflow: hidden;
    display: flex;
    flex-direction: column;
  }

  .column-head {
    background: linear-gradient(135deg, var(--red), #a30d24);
    color: var(--white);
    padding: 14px 14px 12px;
  }

  .column-head .chain-code {
    display: inline-block;
    background: var(--gold);
    color: var(--ink);
    font-weight: 700;
    font-size: 13px;
    padding: 2px 9px;
    border-radius: 999px;
    margin-bottom: 6px;
  }

  .column-head .chain-name {
    font-family: 'Noto Serif TC', serif;
    font-weight: 700;
    font-size: 16px;
    line-height: 1.4;
    margin-bottom: 6px;
  }

  .column-head .chain-meta {
    font-size: 12.5px;
    opacity: 0.92;
    line-height: 1.6;
  }

  .column-head .chain-count {
    font-weight: 700;
  }

  .member-list {
    padding: 10px;
    display: flex;
    flex-direction: column;
    gap: 8px;
    flex: 1;
  }

  .member-card {
    background: var(--gray);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 9px 11px;
    font-size: 13px;
    line-height: 1.5;
    position: relative;
    transition: box-shadow 0.2s, border-color 0.2s;
  }

  .member-card .m-name {
    font-weight: 700;
    font-size: 14px;
  }

  .member-card .m-id {
    color: var(--ink-dim);
    font-size: 12px;
    margin-left: 4px;
  }

  .member-card .m-profession {
    color: var(--ink-dim);
    font-size: 12.5px;
    margin-top: 2px;
  }

  .other-chains {
    display: flex;
    flex-wrap: wrap;
    gap: 4px;
    margin-top: 4px;
  }

  .badge-other-chain {
    display: inline-block;
    background: var(--gold);
    color: var(--ink);
    font-weight: 700;
    font-size: 11px;
    padding: 1px 7px;
    border-radius: 999px;
    vertical-align: middle;
  }

  .member-card.highlight {
    border-color: var(--red);
    box-shadow: 0 0 0 2px var(--red);
    background: #fff4f5;
  }

  .empty-hint {
    color: var(--ink-dim);
    font-size: 12.5px;
    padding: 6px 2px;
  }

  .unassigned-section {
    margin: 4px 0 20px;
    background: var(--white);
    border: 1px dashed var(--border);
    border-radius: 10px;
    padding: 14px 16px;
  }

  .unassigned-section h2 {
    font-family: 'Noto Serif TC', serif;
    font-size: 16px;
    color: var(--red);
    margin-bottom: 8px;
  }

  .unassigned-hint {
    font-family: 'Noto Sans TC', sans-serif;
    font-size: 12px;
    font-weight: 400;
    color: var(--ink-dim);
    margin-left: 6px;
  }

  .unassigned-list {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
  }

  .unassigned-list .member-card { width: 200px; }

  footer {
    text-align: center;
    color: var(--ink-dim);
    font-size: 11.5px;
    padding: 10px 12px 30px;
  }

  #loadStatus {
    text-align: center;
    font-size: 12px;
    color: var(--ink-dim);
    padding: 6px 0 2px;
  }

  /* RWD：手機改橫向捲動每欄，字級不低於 13px，不橫向溢出頁面本體 */
  @media (max-width: 860px) {
    .board {
      display: flex;
      overflow-x: auto;
      scroll-snap-type: x mandatory;
      gap: 10px;
      padding-bottom: 6px;
      -webkit-overflow-scrolling: touch;
    }
    .column {
      min-width: 82vw;
      max-width: 82vw;
      scroll-snap-align: start;
      flex-shrink: 0;
    }
    .unassigned-list .member-card { width: 100%; }

    /* 手機字級一律 ≥13px（PRD § 5.1 RWD 要求），desktop 保留原本較細字級 */
    .m-profession, .chain-meta, .m-id, .badge-other-chain, .empty-hint,
    footer, #searchHint, .column-head .chain-code {
      font-size: 13px;
    }
  }

  /* ============================================================
     編輯模式（里程碑 2）
     ============================================================ */
  .edit-bar {
    max-width: 480px;
    margin: 12px auto 0;
    padding: 0 8px;
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    justify-content: center;
  }

  .edit-btn {
    font-family: 'Noto Sans TC', sans-serif;
    font-size: 13px;
    font-weight: 700;
    padding: 8px 14px;
    border-radius: 999px;
    border: none;
    cursor: pointer;
    background: var(--gold);
    color: var(--ink);
  }

  .edit-btn.active { background: var(--white); }

  body.edit-mode .member-card {
    cursor: pointer;
    transition: box-shadow 0.15s, border-color 0.15s;
  }

  body.edit-mode .member-card:hover {
    border-color: var(--gold);
    box-shadow: 0 0 0 2px var(--gold);
  }

  body.edit-mode .member-card::after {
    content: '✏️';
    position: absolute;
    top: 6px;
    right: 8px;
    font-size: 11px;
    opacity: 0.6;
  }

  .modal-overlay {
    position: fixed;
    inset: 0;
    background: rgba(26, 26, 26, 0.55);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 16px;
    z-index: 1000;
  }

  .modal-overlay[hidden] { display: none; }

  .modal-box {
    background: var(--white);
    border-radius: 12px;
    padding: 22px 20px;
    width: 100%;
    max-width: 380px;
    max-height: 86vh;
    overflow-y: auto;
    box-shadow: 0 10px 30px rgba(0,0,0,0.25);
  }

  .modal-box h3 {
    font-family: 'Noto Serif TC', serif;
    color: var(--red);
    font-size: 17px;
    margin-bottom: 10px;
  }

  .modal-hint {
    font-size: 12.5px;
    color: var(--ink-dim);
    margin-bottom: 10px;
  }

  .modal-label {
    display: block;
    font-size: 12.5px;
    color: var(--ink-dim);
    margin: 10px 0 4px;
  }

  .modal-input {
    width: 100%;
    padding: 10px 12px;
    border-radius: 8px;
    border: 1px solid var(--border);
    font-size: 14px;
    font-family: 'Noto Sans TC', sans-serif;
    margin-bottom: 6px;
  }

  .modal-checkbox-row {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 13px;
    margin: 6px 0 10px;
  }

  .chain-checkboxes {
    display: flex;
    flex-direction: column;
    gap: 8px;
    margin: 12px 0;
  }

  .chain-checkboxes label {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 14px;
    padding: 8px 10px;
    border-radius: 8px;
    background: var(--gray);
    cursor: pointer;
  }

  .chain-checkboxes input { width: 17px; height: 17px; }

  .modal-error {
    color: var(--red);
    font-size: 12.5px;
    min-height: 16px;
    margin-bottom: 4px;
  }

  .modal-actions {
    display: flex;
    gap: 10px;
    margin-top: 8px;
  }

  .modal-btn {
    flex: 1;
    padding: 10px;
    border-radius: 8px;
    border: none;
    font-family: 'Noto Sans TC', sans-serif;
    font-size: 14px;
    font-weight: 700;
    cursor: pointer;
  }

  .modal-btn-cancel { background: var(--gray); color: var(--ink); }
  .modal-btn-primary { background: var(--red); color: var(--white); }
  .modal-btn-primary:disabled { opacity: 0.6; cursor: not-allowed; }

  .toast {
    position: fixed;
    left: 50%;
    bottom: 24px;
    transform: translateX(-50%);
    background: var(--ink);
    color: var(--white);
    padding: 10px 18px;
    border-radius: 999px;
    font-size: 13px;
    z-index: 1100;
    box-shadow: 0 6px 18px rgba(0,0,0,0.3);
  }

  .toast[hidden] { display: none; }
  .toast.error { background: var(--red); }

  /* ============================================================
     存檔快照 ＋ 版本歷史（里程碑 3）
     ============================================================ */
  .modal-box-wide {
    max-width: 560px;
  }

  .history-row {
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 10px 12px;
    margin-bottom: 10px;
  }

  .history-row-head {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    flex-wrap: wrap;
    gap: 4px;
    margin-bottom: 6px;
  }

  .history-meta {
    font-size: 12px;
    color: var(--ink-dim);
  }

  .chain-summary {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    margin-bottom: 8px;
  }

  .chain-count-pill {
    background: var(--gray);
    border: 1px solid var(--border);
    border-radius: 999px;
    font-size: 12px;
    padding: 2px 9px;
  }

  .chain-count-pill-unassigned {
    color: var(--ink-dim);
  }

  .history-preview-toggle {
    background: none;
    border: none;
    color: var(--red);
    font-size: 12.5px;
    cursor: pointer;
    padding: 2px 0;
    text-decoration: underline;
  }

  .history-preview-wrap {
    margin: 6px 0;
    font-size: 12.5px;
    background: var(--gray);
    border-radius: 6px;
    padding: 8px 10px;
  }

  .history-preview-col {
    margin-bottom: 4px;
  }

  .history-row-actions {
    margin-top: 6px;
  }

  .history-restore-btn {
    padding: 6px 12px;
    font-size: 12.5px;
    width: auto;
    flex: none;
  }

  .history-restore-locked {
    font-size: 12px;
    color: var(--ink-dim);
  }
</style>

<header>
  <div class="eyebrow">BNI Hua Urban+ Renewal Chapter</div>

  <div class="edit-bar">

    <button type="button" id="snapshotBtn" class="edit-btn" hidden>📸 存檔目前版本</button>

</header>

<main>
  <div id="loadStatus"></div>

  <div class="unassigned-section">
    <h2>尚未分組<span class="unassigned-hint">這些夥伴尚未分組，可進編輯模式歸類</span></h2>
    <div class="unassigned-list" id="unassignedList"></div>
  </div>

  <div class="board" id="board"></div>
</main>

<footer>
  BNI 華都更分會 PowerTeam 組別管理系統
</footer>

<!-- 組長密碼 gate（進編輯模式前的門檻，PRD § 4：多一道門檻非真安全，doPost 後端另有校驗） -->
<div class="modal-overlay" id="codeModalOverlay" hidden>
  <div class="modal-box">
    <h3>組長編輯模式</h3>
    <p class="modal-hint">請輸入你的組長密碼才能進入編輯模式</p>
    <input type="password" id="codeInput" class="modal-input" placeholder="請輸入組長密碼" autocomplete="off">
    <div class="modal-error" id="codeError"></div>
    <div class="modal-actions">
      <button type="button" class="modal-btn modal-btn-cancel" id="codeCancelBtn">取消</button>
      <button type="button" class="modal-btn modal-btn-primary" id="codeSubmitBtn">確認</button>
    </div>
  </div>
</div>

<!-- 換組／新增組員共用 modal：checkbox 勾選所屬鏈，全部取消＝移回未分組池 -->
<div class="modal-overlay" id="memberModalOverlay" hidden>
  <div class="modal-box">
    <h3 id="memberModalTitle">編輯組員</h3>

    <div id="guestPickerWrap" hidden>
      <label class="modal-label" for="rosterSelect">從名冊選人</label>
      <select id="rosterSelect" class="modal-input"></select>
      <label class="modal-checkbox-row">
        <input type="checkbox" id="manualGuestToggle"> 名冊沒有這個人（手動輸入來賓）
      </label>
      <input type="text" id="guestNameInput" class="modal-input" placeholder="來賓姓名" hidden>
      <input type="text" id="guestProfessionInput" class="modal-input" placeholder="專業別（選填）" hidden>
    </div>

    <div class="chain-checkboxes" id="chainCheckboxes"></div>

    <div class="modal-error" id="memberError"></div>
    <div class="modal-actions">
      <button type="button" class="modal-btn modal-btn-cancel" id="memberCancelBtn">取消</button>
      <button type="button" class="modal-btn modal-btn-primary" id="memberSaveBtn">儲存</button>
    </div>
  </div>
</div>

<!-- 存檔目前版本 modal（里程碑 3）：任何組長密碼皆可存 -->
<div class="modal-overlay" id="snapshotModalOverlay" hidden>
  <div class="modal-box">
    <h3>📸 存檔目前版本</h3>
    <p class="modal-hint">為這個版本命名，之後可在「版本紀錄」找到並還原</p>
    <input type="text" id="snapshotNameInput" class="modal-input" placeholder="例如：2026-07 月版">
    <div class="modal-error" id="snapshotError"></div>
    <div class="modal-actions">
      <button type="button" class="modal-btn modal-btn-cancel" id="snapshotCancelBtn">取消</button>
      <button type="button" class="modal-btn modal-btn-primary" id="snapshotSaveBtn">存檔</button>
    </div>
  </div>
</div>

<!-- 版本紀錄面板（里程碑 3）：列出所有快照，還原鈕僅管理員（密碼 7／張瓊安）看得到 -->
<div class="modal-overlay" id="historyModalOverlay" hidden>
  <div class="modal-box modal-box-wide">
    <h3>🕓 版本紀錄</h3>
    <p class="modal-hint" id="historyHint">載入中…</p>
    <div id="historyList"></div>
    <div class="modal-actions">
      <button type="button" class="modal-btn modal-btn-cancel" id="historyCloseBtn">關閉</button>
    </div>
  </div>
</div>

<!-- 還原二次確認（里程碑 3）：後端 doPost action=restore 仍會再驗一次管理員密碼，前端只是提示層 -->
<div class="modal-overlay" id="restoreConfirmOverlay" hidden>
  <div class="modal-box">
    <h3>確定要還原嗎？</h3>
    <p class="modal-hint" id="restoreConfirmText"></p>
    <div class="modal-error" id="restoreError"></div>
    <div class="modal-actions">
      <button type="button" class="modal-btn modal-btn-cancel" id="restoreCancelBtn">取消</button>
      <button type="button" class="modal-btn modal-btn-primary" id="restoreConfirmBtn">確定還原</button>
    </div>
  </div>
</div>

<div class="toast" id="toast" hidden></div>

<script src="data.js?v=20260730"></script>
<script>
/* ============================================================
   GAS 後端網址（唯讀 doGet，正式部署已上線）
   ============================================================ */
const GAS_URL = "https://script.google.com/macros/s/AKfycbxDLC_mhRaLhlycnLWhRmdTdI9HU6BHQEXhdANMZL0aF0yTTrMzvxHi0u-YyHMJCP9Jzg/exec";

const CHAIN_ORDER = ['A', 'B', 'C', 'D', 'E'];

const boardEl = document.getElementById('board');
const unassignedEl = document.getElementById('unassignedList');
const loadStatusEl = document.getElementById('loadStatus');
const searchInput = document.getElementById('searchInput');
const searchHint = document.getElementById('searchHint');

// 存最新一份看板資料，供編輯模式（modal 開啟時查該員目前所屬鏈、名冊下拉選單）讀取。
let LATEST_DATA = { groups: [], members: [] };

function escapeHtml(s) {
  return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
    return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
  });
}

function memberCardHtml(m, currentCode) {
  // currentCode：卡片目前所在欄的組別 code；null/undefined＝「尚未分組」區（不排除任何 chain）。
  const otherChains = (m.chains || []).filter(function (c) { return c !== currentCode; });
  const pillsHtml = otherChains.length
    ? '<div class="other-chains">' + otherChains.map(function (c) {
        return '<span class="badge-other-chain">' + escapeHtml(c) + '組</span>';
      }).join('') + '</div>'
    : '';
  return (
    '<div class="member-card" data-id="' + m.id + '" data-name="' + escapeHtml(m.name) + '">' +
      '<div class="m-name">' + escapeHtml(m.name) +
        '<span class="m-id">#' + m.id + '</span>' +
      '</div>' +
      '<div class="m-profession">' + escapeHtml(m.profession || '') + '</div>' +
      pillsHtml +
    '</div>'
  );
}

function render(data) {
  LATEST_DATA = data;
  const groups = data.groups || [];
  const members = data.members || [];

  const byCode = {};
  CHAIN_ORDER.forEach(function (c) { byCode[c] = []; });
  members.forEach(function (m) {
    (m.chains || []).forEach(function (c) {
      if (byCode[c]) byCode[c].push(m);
    });
  });

  const groupMeta = {};
  groups.forEach(function (g) { groupMeta[g.code] = g; });

  boardEl.innerHTML = CHAIN_ORDER.map(function (code) {
    const g = groupMeta[code] || { name: code, leader: '', schedule: '' };
    const list = byCode[code] || [];
    const cardsHtml = list.length
      ? list.map(function (m) { return memberCardHtml(m, code); }).join('')
      : '<div class="empty-hint">目前無組員</div>';
    return (
      '<div class="column" data-chain="' + code + '">' +
        '<div class="column-head">' +
          '<span class="chain-code">' + code + '</span>' +
          '<div class="chain-name">' + escapeHtml(g.name) + '</div>' +
          '<div class="chain-meta">組長：' + escapeHtml(g.leader) + ' ・ <span class="chain-count">' + list.length + ' 人</span></div>' +
          '<div class="chain-meta">' + escapeHtml(g.schedule || '待補') + '</div>' +
        '</div>' +
        '<div class="member-list">' + cardsHtml + '</div>' +
      '</div>'
    );
  }).join('');

  const unassigned = members.filter(function (m) { return !m.chains || m.chains.length === 0; });
  unassignedEl.innerHTML = unassigned.length
    ? unassigned.map(function (m) { return memberCardHtml(m, null); }).join('')
    : '<div class="empty-hint">目前所有夥伴皆已分組</div>';

  applySearch();
}

function applySearch() {
  const q = searchInput.value.trim();
  const cards = document.querySelectorAll('.member-card');
  if (!q) {
    cards.forEach(function (c) { c.classList.remove('highlight'); });
    searchHint.textContent = '';
    return;
  }
  let hitCount = 0;
  let firstHit = null;
  cards.forEach(function (c) {
    const name = c.getAttribute('data-name') || '';
    const id = c.getAttribute('data-id') || '';
    const hit = name.indexOf(q) !== -1 || id === q;
    c.classList.toggle('highlight', hit);
    if (hit) {
      hitCount++;
      if (!firstHit) firstHit = c;
    }
  });
  if (hitCount > 0) {
    searchHint.textContent = '找到 ' + hitCount + ' 筆結果（已高亮所在欄位）';
    if (firstHit) firstHit.scrollIntoView({ behavior: 'smooth', block: 'nearest', inline: 'center' });
  } else {
    searchHint.textContent = '沒有找到符合的夥伴';
  }
}

searchInput.addEventListener('input', applySearch);

// 讀取 GAS 最新資料並覆蓋畫面；失敗則保留現有畫面（降級不假裝成功）。
// opts.retries 給存檔後刷新用——doPost 剛寫完緊接 doGet 偶發失敗/太快會誤閃「連不到後端」
// 嚇組長以為沒存到（資料其實已寫對），先靜默重試幾次再顯示降級文案。
function loadFromGas(opts) {
  opts = opts || {};
  var retriesLeft = opts.retries || 0;
  var retryDelayMs = opts.retryDelayMs || 1500;

  return fetch(GAS_URL + '?t=' + Date.now(), { method: 'GET', cache: 'no-store' })
    .then(function (res) { return res.json(); })
    .then(function (data) {
      if (!data || !data.ok) throw new Error('bad response');
      render(data);
      loadStatusEl.textContent = '';
      return data;
    })
    .catch(function (err) {
      if (retriesLeft > 0) {
        return new Promise(function (resolve) { setTimeout(resolve, retryDelayMs); })
          .then(function () { return loadFromGas({ retries: retriesLeft - 1, retryDelayMs: retryDelayMs }); });
      }
      console.error(err);
      loadStatusEl.textContent = '⚠️ 連不到後端，目前顯示的是內建初始分組（可能非最新）';
      throw err;
    });
}

// 判斷 data.json / GAS 回應是不是一份「可以拿來畫看板」的合法資料。
function isValidRosterPayload(data) {
  return !!data && Array.isArray(data.members) && data.members.length > 0 && Array.isArray(data.groups);
}

// 只取 groups/members 內容序列化，用來判斷兩份資料「內容是否真的不同」，
// 忽略 GAS 回應多出的 ok/generatedAt 等每次必變欄位。
function rosterSignature(data) {
  return JSON.stringify({ groups: (data && data.groups) || [], members: (data && data.members) || [] });
}

// 背景靜默核對 GAS：不顯示任何載入文字，資料跟畫面上的一樣就什麼都不做，
// 不一樣才重繪——避免 data.json 快照跟 GAS 現況間的 10 分鐘空窗被使用者看到閃爍。
function silentSyncFromGas() {
  fetch(GAS_URL + '?t=' + Date.now(), { method: 'GET', cache: 'no-store' })
    .then(function (res) { return res.json(); })
    .then(function (data) {
      if (!isValidRosterPayload(data)) return;
      if (rosterSignature(data) !== rosterSignature(LATEST_DATA)) render(data);
    })
    .catch(function (err) {
      console.error('背景核對 GAS 失敗（不影響目前畫面）', err);
    });
}

// 冷啟：優先讀 data.json（GitHub Actions 每 10 分鐘同步的靜態快照，讀取幾乎瞬間），
// 成功就立刻畫面上桌，背景再靜默核對一次 GAS 現況；
// data.json 讀失敗或內容不合法（尚未產生過快照／格式跑掉）才退回舊流程：
// 內嵌 PT_SEED 先畫，再走現有 loadFromGas() 可見降級文案。
fetch('data.json?t=' + Date.now(), { cache: 'no-store' })
  .then(function (res) {
    if (!res.ok) throw new Error('data.json HTTP ' + res.status);
    return res.json();
  })
  .then(function (data) {
    if (!isValidRosterPayload(data)) throw new Error('data.json 內容不合法');
    render(data);
    silentSyncFromGas();
  })
  .catch(function (err) {
    console.error('讀取 data.json 失敗，退回內建 seed + GAS 直連', err);
    render(window.PT_SEED || { groups: [], members: [] });
    loadFromGas();
  });
</script>

<script>
/* ============================================================
   組長編輯模式（里程碑 2 ＋ 2.1：組長密碼）
   組長密碼＝各組長會員編號，只在前端做「多一道門檻」判斷（PRD § 4，非真安全機制，
   會員編號本就是看板公開資訊）；真正的寫入授權與身份判斷由後端 doPost 用同一組密碼
   反查組長身份（不信前端傳來的身份字串，防偽造）。
   ============================================================ */
// 各組長密碼（＝會員編號）。前端只需要「是不是合法密碼」這道門檻，
// 誰是誰、last_editor 寫誰一律由後端 resolveLeaderByCode_ 決定。
// 2026-08-09 擴充：成長協調組全員（組長陳昭男 35 ＋ 組員 5/28/31/34/36）也能編輯。
// 來源：九長會議索引「成長協調｜035 陳昭男 Johnny｜005 劉恩秀、028 林佩君、031 凃馨文、032 柳慧燕、034 張瑜晏、036 包育翎」。
// 032 柳慧燕已在組長名單內（A 組長），不重複。
// 2026-08-26：E 組組長交接（8/7 邱愛莉批准）——43 洪嘉璿左左接任組長、7 張瓊安轉副組長，兩人都保留編輯權。
// 前 6 碼＝五組組長（43 洪嘉璿左左／7 張瓊安副組長／11 陳靖薇／10 王春雄／4 陳向柔／32 柳慧燕），後 6 碼＝成長協調。
const LEADER_CODES = ['43', '7', '11', '10', '4', '32', '35', '5', '28', '31', '34', '36'];

function normalizeLeaderCode(raw) {
  return String(raw || '').trim().replace(/^0+(?=\d)/, '');
}

let editMode = false;
let savedEditCode = '';
let isAdmin = false; // 密碼 7／張瓊安才 true；只決定「還原鈕要不要出現」，後端 doPost action=restore 仍會再驗一次（里程碑 3）
let editingMemberId = null; // 卡片點擊進來的編輯：目前這位的 id；新增組員流程則用 rosterSelect 決定

const editToggleBtn = document.getElementById('editToggleBtn');
const addGuestBtn = document.getElementById('addGuestBtn');

const codeModalOverlay = document.getElementById('codeModalOverlay');
const codeInput = document.getElementById('codeInput');
const codeError = document.getElementById('codeError');
const codeCancelBtn = document.getElementById('codeCancelBtn');
const codeSubmitBtn = document.getElementById('codeSubmitBtn');

const memberModalOverlay = document.getElementById('memberModalOverlay');
const memberModalTitle = document.getElementById('memberModalTitle');
const guestPickerWrap = document.getElementById('guestPickerWrap');
const rosterSelect = document.getElementById('rosterSelect');
const manualGuestToggle = document.getElementById('manualGuestToggle');
const guestNameInput = document.getElementById('guestNameInput');
const guestProfessionInput = document.getElementById('guestProfessionInput');
const chainCheckboxes = document.getElementById('chainCheckboxes');
const memberError = document.getElementById('memberError');
const memberCancelBtn = document.getElementById('memberCancelBtn');
const memberSaveBtn = document.getElementById('memberSaveBtn');

const toastEl = document.getElementById('toast');
let toastTimer = null;

function showToast(msg, isError) {
  toastEl.textContent = msg;
  toastEl.classList.toggle('error', !!isError);
  toastEl.hidden = false;
  clearTimeout(toastTimer);
  toastTimer = setTimeout(function () { toastEl.hidden = true; }, 3200);
}

/* ---------- 組長密碼 gate modal ---------- */

function openCodeModal() {
  codeInput.value = '';
  codeError.textContent = '';
  codeModalOverlay.hidden = false;
  codeInput.focus();
}

function closeCodeModal() {
  codeModalOverlay.hidden = true;
}

function submitCode() {
  const normalized = normalizeLeaderCode(codeInput.value);
  if (LEADER_CODES.indexOf(normalized) !== -1) {
    savedEditCode = normalized; // 傳給後端的密碼；後端會再自己反查一次身份，不信這裡
    isAdmin = normalized === '7'; // 只決定「還原鈕要不要出現」；真正授權一律由後端 doPost action=restore 再驗一次
    closeCodeModal();
    // 進編輯模式前先拉一次 GAS 最新資料當編輯基準，避免兩位組長前後台資料不同步、
    // 改到一半互相覆蓋。這裡可以顯示等待提示，組長本來就預期存檔要等。
    loadStatusEl.textContent = '正在同步最新分組資料…';
    loadFromGas()
      .catch(function () { /* 失敗仍讓組長進得去，沿用目前畫面資料；loadFromGas 內部已設置降級文案 */ })
      .then(function () { enterEditMode(); });
  } else {
    codeError.textContent = '組長密碼不正確，請再試一次';
  }
}

function enterEditMode() {
  editMode = true;
  document.body.classList.add('edit-mode');
  editToggleBtn.textContent = '🔒 離開編輯模式';
  editToggleBtn.classList.add('active');
  addGuestBtn.hidden = false;
  snapshotBtn.hidden = false;
  historyBtn.hidden = false;
}

function exitEditMode() {
  editMode = false;
  isAdmin = false;
  document.body.classList.remove('edit-mode');
  editToggleBtn.textContent = '🔓 組長編輯模式';
  editToggleBtn.classList.remove('active');
  addGuestBtn.hidden = true;
  snapshotBtn.hidden = true;
  historyBtn.hidden = true;
}

editToggleBtn.addEventListener('click', function () {
  if (editMode) {
    exitEditMode();
  } else {
    openCodeModal();
  }
});

codeCancelBtn.addEventListener('click', closeCodeModal);
codeSubmitBtn.addEventListener('click', submitCode);
codeInput.addEventListener('keydown', function (e) {
  if (e.key === 'Enter') submitCode();
});

/* ---------- 換組／新增組員共用 modal ---------- */

function chainLabel(code) {
  const g = (LATEST_DATA.groups || []).find(function (x) { return x.code === code; });
  return code + (g && g.name ? '｜' + g.name : '');
}

function buildChainCheckboxes(selectedCodes) {
  chainCheckboxes.innerHTML = CHAIN_ORDER.map(function (code) {
    const checked = selectedCodes.indexOf(code) !== -1 ? ' checked' : '';
    return (
      '<label>' +
        '<input type="checkbox" class="chain-cb" value="' + code + '"' + checked + '>' +
        escapeHtml(chainLabel(code)) +
      '</label>'
    );
  }).join('');
}

function getCheckedChains() {
  return Array.from(chainCheckboxes.querySelectorAll('.chain-cb:checked')).map(function (cb) { return cb.value; });
}

function findMemberById(id) {
  return (LATEST_DATA.members || []).find(function (m) { return String(m.id) === String(id); });
}

// 點組員卡開啟：換組／移除（全取消勾選）共用這支
function openMemberModal(id, name) {
  editingMemberId = id;
  const member = findMemberById(id);
  memberModalTitle.textContent = '編輯組員：' + (member ? member.name : name) + '（#' + id + '）';
  guestPickerWrap.hidden = true;
  memberError.textContent = '';
  buildChainCheckboxes(member ? member.chains : []);
  memberModalOverlay.hidden = false;
}

// 「＋ 新增組員」開啟：從 55 人名冊下拉挑人，或手動輸入名冊沒有的臨時來賓
function openAddGuestModal() {
  editingMemberId = null;
  memberModalTitle.textContent = '新增組員';
  memberError.textContent = '';
  guestPickerWrap.hidden = false;
  manualGuestToggle.checked = false;
  guestNameInput.hidden = true;
  guestProfessionInput.hidden = true;
  guestNameInput.value = '';
  guestProfessionInput.value = '';

  const roster = (LATEST_DATA.members || []).slice().sort(function (a, b) { return Number(a.id) - Number(b.id); });
  rosterSelect.innerHTML = roster.map(function (m) {
    return '<option value="' + m.id + '">#' + m.id + ' ' + escapeHtml(m.name) + '</option>';
  }).join('');
  rosterSelect.disabled = false;

  if (roster.length) {
    buildChainCheckboxes(roster[0].chains || []);
  } else {
    buildChainCheckboxes([]);
  }
  memberModalOverlay.hidden = false;
}

rosterSelect.addEventListener('change', function () {
  const m = findMemberById(rosterSelect.value);
  buildChainCheckboxes(m ? m.chains : []);
});

manualGuestToggle.addEventListener('change', function () {
  const manual = manualGuestToggle.checked;
  guestNameInput.hidden = !manual;
  guestProfessionInput.hidden = !manual;
  rosterSelect.disabled = manual;
  buildChainCheckboxes(manual ? [] : (findMemberById(rosterSelect.value) || {}).chains || []);
});

function closeMemberModal() {
  memberModalOverlay.hidden = true;
}

memberCancelBtn.addEventListener('click', closeMemberModal);

addGuestBtn.addEventListener('click', function () {
  if (editMode) openAddGuestModal();
});

// 編輯模式下點任一組員卡（看板欄位或未分組池皆可）→ 開換組 modal
document.addEventListener('click', function (e) {
  if (!editMode) return;
  const card = e.target.closest('.member-card');
  if (!card) return;
  openMemberModal(card.getAttribute('data-id'), card.getAttribute('data-name'));
});

function saveMember() {
  const chains = getCheckedChains();
  const isGuestFlow = !guestPickerWrap.hidden;
  let payload = { code: savedEditCode, chains: chains };

  if (isGuestFlow && manualGuestToggle.checked) {
    const name = guestNameInput.value.trim();
    if (!name) {
      memberError.textContent = '請輸入來賓姓名';
      return;
    }
    payload.isNewGuest = true;
    payload.name = name;
    payload.profession = guestProfessionInput.value.trim();
  } else if (isGuestFlow) {
    payload.id = rosterSelect.value;
  } else {
    payload.id = editingMemberId;
  }

  memberError.textContent = '';
  memberSaveBtn.disabled = true;
  memberSaveBtn.textContent = '儲存中…';

  // text/plain body（不設 Content-Type header，瀏覽器預設 text/plain 避開 CORS preflight，PRD § 6.1）
  fetch(GAS_URL, { method: 'POST', body: JSON.stringify(payload) })
    .then(function (res) { return res.json(); })
    .then(function (data) {
      if (!data || !data.ok) {
        memberError.textContent = (data && data.error) || '儲存失敗，請重試';
        return;
      }
      closeMemberModal();
      showToast('✅ 已儲存：' + data.name);
      return loadFromGas({ retries: 2, retryDelayMs: 1500 });
    })
    .catch(function (err) {
      memberError.textContent = '網路錯誤，請重試：' + err.message;
    })
    .finally(function () {
      memberSaveBtn.disabled = false;
      memberSaveBtn.textContent = '儲存';
    });
}

memberSaveBtn.addEventListener('click', saveMember);
</script>

<script>
/* ============================================================
   存檔快照 ＋ 版本歷史 ＋ 還原（里程碑 3）
   還原鈕是否出現只看前端 isAdmin（密碼 7／張瓊安）——這只是 UX 層的第一道門檻，
   真正授權一律由後端 doPost action=restore 用密碼反查身份再驗一次（見 gas/Code.gs handleRestoreAction_），
   不論這裡的旗標被怎麼繞過，非管理員密碼一律被後端拒絕。
   ============================================================ */
const snapshotBtn = document.getElementById('snapshotBtn');
const historyBtn = document.getElementById('historyBtn');

const snapshotModalOverlay = document.getElementById('snapshotModalOverlay');
const snapshotNameInput = document.getElementById('snapshotNameInput');
const snapshotError = document.getElementById('snapshotError');
const snapshotCancelBtn = document.getElementById('snapshotCancelBtn');
const snapshotSaveBtn = document.getElementById('snapshotSaveBtn');

const historyModalOverlay = document.getElementById('historyModalOverlay');
const historyHint = document.getElementById('historyHint');
const historyList = document.getElementById('historyList');
const historyCloseBtn = document.getElementById('historyCloseBtn');

const restoreConfirmOverlay = document.getElementById('restoreConfirmOverlay');
const restoreConfirmText = document.getElementById('restoreConfirmText');
const restoreError = document.getElementById('restoreError');
const restoreCancelBtn = document.getElementById('restoreCancelBtn');
const restoreConfirmBtn = document.getElementById('restoreConfirmBtn');

let LATEST_SNAPSHOTS = [];
let pendingRestoreTimestamp = null;

function defaultSnapshotName() {
  const now = new Date();
  const y = now.getFullYear();
  const m = String(now.getMonth() + 1).padStart(2, '0');
  return y + '-' + m + ' 月版';
}

function formatTaipeiTime(iso) {
  try {
    return new Date(iso).toLocaleString('zh-TW', {
      timeZone: 'Asia/Taipei', year: 'numeric', month: '2-digit', day: '2-digit',
      hour: '2-digit', minute: '2-digit', hour12: false
    });
  } catch (err) {
    return iso;
  }
}

/* ---------- 存檔目前版本 ---------- */

function openSnapshotModal() {
  snapshotNameInput.value = defaultSnapshotName();
  snapshotError.textContent = '';
  snapshotModalOverlay.hidden = false;
  snapshotNameInput.focus();
  snapshotNameInput.select();
}

function closeSnapshotModal() {
  snapshotModalOverlay.hidden = true;
}

function saveSnapshot() {
  const name = snapshotNameInput.value.trim();
  if (!name) {
    snapshotError.textContent = '請輸入快照名稱';
    return;
  }
  snapshotError.textContent = '';
  snapshotSaveBtn.disabled = true;
  snapshotSaveBtn.textContent = '存檔中…';

  fetch(GAS_URL, { method: 'POST', body: JSON.stringify({ code: savedEditCode, action: 'snapshot', name: name }) })
    .then(function (res) { return res.json(); })
    .then(function (data) {
      if (!data || !data.ok) {
        snapshotError.textContent = (data && data.error) || '存檔失敗，請重試';
        return;
      }
      closeSnapshotModal();
      showToast('📸 已存檔版本〈' + data.name + '〉');
    })
    .catch(function (err) {
      snapshotError.textContent = '網路錯誤，請重試：' + err.message;
    })
    .finally(function () {
      snapshotSaveBtn.disabled = false;
      snapshotSaveBtn.textContent = '存檔';
    });
}

snapshotBtn.addEventListener('click', function () { if (editMode) openSnapshotModal(); });
snapshotCancelBtn.addEventListener('click', closeSnapshotModal);
snapshotSaveBtn.addEventListener('click', saveSnapshot);
snapshotNameInput.addEventListener('keydown', function (e) {
  if (e.key === 'Enter') saveSnapshot();
});

/* ---------- 版本紀錄面板 ---------- */

function chainSummaryHtml(counts) {
  return CHAIN_ORDER.map(function (c) {
    return '<span class="chain-count-pill">' + c + ' ' + (counts[c] || 0) + '</span>';
  }).join('') + '<span class="chain-count-pill chain-count-pill-unassigned">未分組 ' + (counts.unassigned || 0) + '</span>';
}

function memberNameById(id) {
  const m = (LATEST_DATA.members || []).find(function (x) { return String(x.id) === String(id); });
  return m ? m.name : ('#' + id + '（找不到姓名，可能已異動）');
}

function previewHtml(members) {
  const byChain = {};
  CHAIN_ORDER.forEach(function (c) { byChain[c] = []; });
  (members || []).forEach(function (m) {
    (m.chains || []).forEach(function (c) { if (byChain[c]) byChain[c].push(memberNameById(m.id)); });
  });
  return '<div class="history-preview">' + CHAIN_ORDER.map(function (c) {
    return '<div class="history-preview-col"><strong>' + c + '</strong>：' + (byChain[c].join('、') || '（無）') + '</div>';
  }).join('') + '</div>';
}

function historyRowHtml(snap, idx) {
  const restoreBtnHtml = isAdmin
    ? '<button type="button" class="modal-btn modal-btn-primary history-restore-btn" data-idx="' + idx + '">還原到這版</button>'
    : '<span class="history-restore-locked">只有管理員能還原</span>';
  return (
    '<div class="history-row">' +
      '<div class="history-row-head">' +
        '<div><strong>' + escapeHtml(snap.name) + '</strong></div>' +
        '<div class="history-meta">' + formatTaipeiTime(snap.timestamp) + '・操作者：' + escapeHtml(snap.operator) + '</div>' +
      '</div>' +
      '<div class="chain-summary">' + chainSummaryHtml(snap.counts) + '</div>' +
      '<button type="button" class="history-preview-toggle" data-idx="' + idx + '">預覽名單</button>' +
      '<div class="history-preview-wrap" id="historyPreview' + idx + '" hidden></div>' +
      '<div class="history-row-actions">' + restoreBtnHtml + '</div>' +
    '</div>'
  );
}

function openHistoryModal() {
  historyModalOverlay.hidden = false;
  historyHint.textContent = '載入中…';
  historyList.innerHTML = '';

  fetch(GAS_URL + '?action=listSnapshots&t=' + Date.now(), { method: 'GET', cache: 'no-store' })
    .then(function (res) { return res.json(); })
    .then(function (data) {
      if (!data || !data.ok) throw new Error('bad response');
      LATEST_SNAPSHOTS = data.snapshots || [];
      if (!LATEST_SNAPSHOTS.length) {
        historyHint.textContent = '目前還沒有任何存檔版本';
        return;
      }
      historyHint.textContent = '共 ' + LATEST_SNAPSHOTS.length + ' 筆版本（新到舊）';
      historyList.innerHTML = LATEST_SNAPSHOTS.map(function (s, i) { return historyRowHtml(s, i); }).join('');
    })
    .catch(function (err) {
      historyHint.textContent = '⚠️ 載入版本紀錄失敗，請重試：' + err.message;
    });
}

function closeHistoryModal() {
  historyModalOverlay.hidden = true;
}

historyBtn.addEventListener('click', function () { if (editMode) openHistoryModal(); });
historyCloseBtn.addEventListener('click', closeHistoryModal);

historyList.addEventListener('click', function (e) {
  const previewToggleBtn = e.target.closest('.history-preview-toggle');
  if (previewToggleBtn) {
    const idx = previewToggleBtn.getAttribute('data-idx');
    const wrap = document.getElementById('historyPreview' + idx);
    if (wrap.hidden) {
      wrap.innerHTML = previewHtml(LATEST_SNAPSHOTS[idx].members);
      wrap.hidden = false;
      previewToggleBtn.textContent = '收合名單';
    } else {
      wrap.hidden = true;
      previewToggleBtn.textContent = '預覽名單';
    }
    return;
  }
  const restoreBtn = e.target.closest('.history-restore-btn');
  if (restoreBtn) {
    const idx = restoreBtn.getAttribute('data-idx');
    const snap = LATEST_SNAPSHOTS[idx];
    openRestoreConfirm(snap.timestamp, snap.name);
  }
});

/* ---------- 還原二次確認 ---------- */

function openRestoreConfirm(timestamp, name) {
  pendingRestoreTimestamp = timestamp;
  restoreConfirmText.textContent = '確定把分組還原到〈' + name + '〉？目前分組會被覆蓋（系統會先自動備份現況）';
  restoreError.textContent = '';
  restoreConfirmOverlay.hidden = false;
}

function closeRestoreConfirm() {
  restoreConfirmOverlay.hidden = true;
}

function confirmRestore() {
  if (!isAdmin) {
    restoreError.textContent = '只有管理員能還原';
    return;
  }
  restoreError.textContent = '';
  restoreConfirmBtn.disabled = true;
  restoreConfirmBtn.textContent = '還原中…';

  fetch(GAS_URL, { method: 'POST', body: JSON.stringify({ code: savedEditCode, action: 'restore', timestamp: pendingRestoreTimestamp }) })
    .then(function (res) { return res.json(); })
    .then(function (data) {
      if (!data || !data.ok) {
        restoreError.textContent = (data && data.error) || '還原失敗，請重試';
        return;
      }
      closeRestoreConfirm();
      closeHistoryModal();
      showToast('⚠️ 已還原到〈' + data.snapshotName + '〉版本（已自動備份現況）');
      return loadFromGas({ retries: 2, retryDelayMs: 1500 });
    })
    .catch(function (err) {
      restoreError.textContent = '網路錯誤，請重試：' + err.message;
    })
    .finally(function () {
      restoreConfirmBtn.disabled = false;
      restoreConfirmBtn.textContent = '確定還原';
    });
}

restoreCancelBtn.addEventListener('click', closeRestoreConfirm);
restoreConfirmBtn.addEventListener('click', confirmRestore);
</script>
